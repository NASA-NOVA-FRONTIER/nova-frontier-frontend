name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's older run. Pushes to main get a group per run, so every merge
# finishes its E2E (a shared group would cancel the waiting run in between, even without cancel-in-progress).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Docs-only PRs skip the E2E. Plain git instead of a paths-filter action: no extra action or token
  # permission to depend on. Pushes to main always run everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merged into its base, so HEAD^1..HEAD is exactly what the PR changes.
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT" # when in doubt, run the E2E
            exit 0
          fi
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Required status check: keep its name and its own build.
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Runs next to checks so the shards start as soon as dist/ exists, not after lint and unit tests.
  build:
    name: Build for E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries still have to be installed.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
        env:
          CI: true
          E2E_PREBUILT: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Same name as the old single E2E job: one place to read the result and the merged report.
  e2e-report:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, build, e2e]
    if: ${{ !cancelled() }}
    steps:
      - id: plan
        run: |
          if [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Docs-only change: E2E skipped."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.e2e.result }}" = "success" ] || [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.plan.outputs.merge == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.merge == 'true'
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.merge == 'true'
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.plan.outputs.merge == 'true'
      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.merge == 'true'
        with:
          pattern: blob-report-*
          path: all-blob-reports/
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,list ./all-blob-reports
        if: steps.plan.outputs.merge == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.merge == 'true' && needs.e2e.result == 'failure'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Shards that are skipped because the build failed must not look like a docs-only pass.
      - name: Result
        run: |
          echo "changes=${{ needs.changes.result }} build=${{ needs.build.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then exit 0; fi
          [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ]
